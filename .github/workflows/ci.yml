name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules/**

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --exclude "^https://id.atlassian.com"
            --exclude "^https://github.com/.*/pull/"
            --exclude "^https://www.npmjs.com"
            --exclude "localhost"
            '**/*.md'
          fail: true

  install-test:
    name: Install Script Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [claude-code, antigravity, codex, all]
    steps:
      - uses: actions/checkout@v4

      - name: Create test project directory
        run: mkdir -p /tmp/test-project

      - name: Run install script
        run: ./install.sh /tmp/test-project --tool ${{ matrix.tool }}

      - name: Verify Claude Code installation
        if: matrix.tool == 'claude-code' || matrix.tool == 'all'
        run: |
          test -d /tmp/test-project/.claude/commands
          test -d /tmp/test-project/.claude/reference
          test -f /tmp/test-project/.claude/commands/ideate.md
          test -f /tmp/test-project/.claude/commands/code-review.md
          test -f /tmp/test-project/.claude/reference/frameworks.md
          echo "✅ Claude Code installation verified"

      - name: Verify Antigravity installation
        if: matrix.tool == 'antigravity' || matrix.tool == 'all'
        run: |
          test -d /tmp/test-project/.gemini/antigravity/skills/ideate
          test -f /tmp/test-project/.gemini/antigravity/skills/ideate/SKILL.md
          test -f /tmp/test-project/.gemini/antigravity/skills/ideate/resources/frameworks.md
          test -f /tmp/test-project/.gemini/antigravity/skills/code-review/SKILL.md
          test -f /tmp/test-project/.gemini/antigravity/skills/code-review/resources/review-standards.md
          echo "✅ Antigravity installation verified"

      - name: Verify Codex installation
        if: matrix.tool == 'codex' || matrix.tool == 'all'
        run: |
          test -d /tmp/test-project/.agents/workflows
          test -d /tmp/test-project/.agents/reference
          test -f /tmp/test-project/.agents/workflows/ideate.md
          test -f /tmp/test-project/AGENTS.md
          echo "✅ Codex installation verified"

      - name: Verify .gitignore entries
        run: |
          grep -q ".agents/plans/" /tmp/test-project/.gitignore
          grep -q ".agents/reviews/" /tmp/test-project/.gitignore
          grep -q ".agents/retros/" /tmp/test-project/.gitignore
          grep -q ".agents/rules/" /tmp/test-project/.gitignore
          echo "✅ .gitignore entries verified"

  workflow-check:
    name: Workflow Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow structure
        run: ./scripts/check-workflows.sh
